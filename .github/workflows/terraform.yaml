

name: Terraform Validation

on:
  push:
    branches:   # run the workflow when code is pushed to the main branch
      - main

  pull_request:
    branches:   # also run the workflow when someone creates a pull request to the main branch
      - main

jobs:
  terraform:
    name: Validate Terraform  # internal name of the job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository   # downloads repository code into the GitHub Actions VM
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      # - name: Terraform Validate
      #   run: terraform validate

